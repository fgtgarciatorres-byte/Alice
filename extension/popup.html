<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alice</title><style>
:root{color-scheme:dark}body{margin:0;width:390px;max-height:580px;overflow:auto;background:#111525;color:#ecf0ff;font:14px system-ui,sans-serif}header{padding:18px 18px 12px;background:linear-gradient(120deg,#242a56,#15182c)}h1{margin:0;font-size:23px}h2{font-size:14px;margin:15px 0 8px}main{padding:0 16px 20px}textarea{box-sizing:border-box;width:100%;background:#1b2034;color:#fff;border:1px solid #4c5576;border-radius:9px;padding:10px;resize:vertical;min-height:65px}button{background:#5668dc;border:0;color:white;padding:9px 10px;border-radius:8px;cursor:pointer;font-weight:600}button.secondary{background:#2a314b}button:focus-visible,textarea:focus-visible{outline:2px solid #adc5ff}.row{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.hint{color:#a8b2d0;font-size:12px;line-height:1.5}.agent{padding:10px;background:#1b2034;border-radius:10px;margin:8px 0}.agent .row{align-items:center;justify-content:space-between}.agent textarea{min-height:58px}.status{min-height:18px;font-size:12px;color:#b7f4d0;white-space:pre-wrap}.small{font-size:12px;color:#b9c4e5}#prompt{height:108px}#results{white-space:pre-wrap;overflow-wrap:anywhere}
</style></head><body><header><h1>Alice <span class="small">v0.2 · navegador</span></h1><div class="hint">Tu coordinadora, sin claves API</div></header><main><h2>1 · Encargo</h2><textarea id="task" placeholder="Ej.: Examina el uso del regolito sinterizado para un vial marciano"></textarea><div class="row"><button id="prepare">Preparar consulta</button><button id="reset" class="secondary">Nueva tarea</button></div><h2>2 · Texto para el servicio</h2><textarea id="prompt" readonly aria-label="Consulta generada"></textarea><div class="row"><button id="copy">Copiar consulta</button><span id="status" class="status" role="status"></span></div><div class="hint">Alice no lee ni envía mensajes automáticamente. Abre la pestaña, pega la consulta y copia la respuesta para guardarla aquí.</div><h2>3 · Agentes conectados por pestaña</h2><div id="agents"></div><h2>4 · Contraste</h2><button id="compare" class="secondary">Mostrar respuestas reunidas</button><pre id="results" class="small"></pre></main><script src="popup.js"></script></body></html>
